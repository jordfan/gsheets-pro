name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck and offline tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the package declares, and the version most people run.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: build
        run: npm run build

      - name: offline tests
        # No credentials are available here, and none are needed: test/live is
        # excluded by the vitest config and runs only against a disposable
        # spreadsheet with GSHEETS_PRO_LIVE_SPREADSHEET set.
        run: npm test

      - name: the CLI runs from the build
        run: node dist/cli.js --help
